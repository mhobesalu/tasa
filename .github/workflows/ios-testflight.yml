name: iPhone build to TestFlight

# Run by hand: Actions -> "iPhone build to TestFlight" -> Run workflow.
# Builds the app on Expo's servers (EAS) and sends it to TestFlight.
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_key.p8
      EXPO_APPLE_TEAM_ID: 438T57C352
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$EXPO_ASC_API_KEY_PATH"
      # EAS can only create the Apple signing certificate and profile in
      # interactive mode, so run it in a pseudo-terminal and accept the
      # default answer (Enter) to each question. The App Store Connect key
      # above is used for Apple, so no Apple password is asked for.
      - name: Build and send to TestFlight
        timeout-minutes: 60
        run: |
          unset CI
          yes "" | script -q -e -c "npx --yes eas-cli@latest build --platform ios --profile production --auto-submit" /dev/null
      - name: Remove key
        if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
