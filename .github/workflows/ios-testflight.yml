name: iPhone build to TestFlight

# Run by hand: Actions -> "iPhone build to TestFlight" -> Run workflow.
# Builds the app on Expo's servers (EAS) and sends it to TestFlight.
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc_key.p8
      EXPO_APPLE_TEAM_ID: 438T57C352
      EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$EXPO_ASC_API_KEY_PATH"
      # EAS Submit only uses the App Store Connect key when eas.json names it.
      # The key ID and issuer ID are kept as secrets, so add them here at run time.
      - name: Point EAS Submit at the App Store Connect key
        run: |
          jq --arg id "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" --arg p "$EXPO_ASC_API_KEY_PATH" \
            '.submit.production.ios += {ascApiKeyId: $id, ascApiKeyIssuerId: $iss, ascApiKeyPath: $p}' eas.json > eas.tmp
          mv eas.tmp eas.json
      # The Apple signing certificate and profile were created on the first
      # run (interactive) and are stored on Expo, so builds run non-interactively:
      # a missing answer fails fast instead of waiting for the 60-minute limit.
      # EAS_NO_VCS: upload the folder as it is (with the eas.json change above);
      # .gitignore still applies, and the key file lives outside app/.
      # Free builds can wait a long time in Expo's queue, hence 120 minutes.
      - name: Build and send to TestFlight
        timeout-minutes: 120
        env:
          EAS_NO_VCS: 1
        run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --auto-submit
      - name: Remove key
        if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
