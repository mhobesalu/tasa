name: Android build for Google Play

# Run by hand: Actions -> "Android build for Google Play" -> Run workflow.
# Builds the Android app bundle (.aab) here on a free GitHub Linux machine
# (not counted in Expo's free build plan). The signing key is kept on Expo.
# Makes two files (see this run's Artifacts):
#   tasa-android      .aab for Google Play (first upload by hand in Play Console)
#   tasa-android-apk  .apk to install directly on an Android phone, before TASA is on Play
# Secret: EXPO_TOKEN
on:
  workflow_dispatch:
  # also runs when this file itself changes on a work branch, to test it before merging
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/android-build.yml"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - profile: production
            file: tasa.aab
            name: tasa-android
          - profile: preview
            file: tasa.apk
            name: tasa-android-apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        timeout-minutes: 60
        env:
          EAS_NO_VCS: 1
        run: npx --yes eas-cli@latest build --local --platform android --profile ${{ matrix.profile }} --non-interactive --output "$RUNNER_TEMP/${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.file }}
          retention-days: 30
