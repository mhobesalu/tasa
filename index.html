<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TASA</title>
<meta name="description" content="TASA: tasa sõuad, kaugele jõuad. Õppimise planeerija lapsele.">
<meta name="theme-color" content="#2A8C8C">
<link rel="icon" type="image/svg+xml" href="assets/tasa-app-icon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--lake:#2A8C8C;--lake-ink:#1D6B6B;--ink:#1F2A44;--muted:#535C70;--paper:#FFF7E8;--on-lake:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.1rem/1.6 var(--body);display:grid;grid-template-rows:1fr auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{display:grid;place-content:center;justify-items:center;text-align:center;gap:22px;padding-block:48px}
main img{width:min(400px,100%);height:auto}
h1{font:800 clamp(2rem,6vw,3rem)/1.1 var(--display);margin:0;color:var(--lake-ink);text-wrap:balance}
.en{margin:-14px 0 0;color:var(--muted)}
.btn{display:inline-block;background:var(--lake);color:var(--on-lake);font-weight:700;text-decoration:none;padding:16px 28px;border-radius:14px;margin-top:8px}
.btn:hover{background:var(--lake-ink)}
.btn:focus-visible{outline:3px solid #F7B32B;outline-offset:3px}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px))}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <img src="assets/tasa-logo.svg" alt="TASA" width="330" height="110">
  <h1>Tasa sõuad, kaugele jõuad.</h1>
  <p class="en" lang="en">Row slowly, go far.</p>
  <a class="btn" href="demo/">Vaata näidist <span aria-hidden="true">→</span></a>
</main>
<footer>Sild Growth OÜ · <a href="mailto:maria@sildpartners.com">maria@sildpartners.com</a></footer>
</body>
</html>
